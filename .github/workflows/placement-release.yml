name: Publish Placement Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Assets/com.koiusa.placement/**
      - .github/workflows/placement-release.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: placement-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_PATH: Assets/com.koiusa.placement

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        shell: bash
        run: |
          package_version="$(jq -r '.version' "$PACKAGE_PATH/package.json")"
          if [[ -z "$package_version" || "$package_version" == "null" ]]; then
            echo "package.json does not contain a valid version" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Check if tag exists
        id: check_tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/placement-v${PACKAGE_VERSION}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push Git tag
        if: steps.check_tag.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "placement-v${PACKAGE_VERSION}"
          git push origin "placement-v${PACKAGE_VERSION}"

      - name: Set up Node.js
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish to npm
        if: steps.check_tag.outputs.exists == 'false'
        working-directory: ${{ env.PACKAGE_PATH }}
        run: npm publish --access public
